<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Contact and collaboration visual">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A365D"/><stop offset="100%" stop-color="#1E3F20"/>
    </linearGradient>
    <filter id="cds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#081426" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#cbg)"/>
  <circle cx="980" cy="150" r="180" fill="#C86B45" opacity="0.12"/>
  <circle cx="220" cy="650" r="210" fill="#F9F8F6" opacity="0.05"/>
  <!-- message card -->
  <g filter="url(#cds)" transform="translate(290,150)">
    <rect width="620" height="500" rx="24" fill="rgba(249,248,246,.97)"/>
    <rect x="0" y="0" width="620" height="86" rx="24" fill="#F9F8F6"/>
    <rect x="0" y="62" width="620" height="24" fill="#F9F8F6"/>
    <circle cx="46" cy="43" r="9" fill="#C86B45" opacity=".85"/>
    <circle cx="72" cy="43" r="9" fill="#1E3F20" opacity=".55"/>
    <circle cx="98" cy="43" r="9" fill="#1A365D" opacity=".45"/>
    <text x="130" y="49" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#1A365D">Let’s collaborate</text>
    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="42" y="125" width="250" height="54" rx="14" fill="#fff" stroke="rgba(26,54,93,.12)"/>
      <rect x="328" y="125" width="250" height="54" rx="14" fill="#fff" stroke="rgba(26,54,93,.12)"/>
      <rect x="42" y="199" width="536" height="54" rx="14" fill="#fff" stroke="rgba(26,54,93,.12)"/>
      <rect x="42" y="273" width="536" height="130" rx="14" fill="#fff" stroke="rgba(26,54,93,.12)"/>
      <text x="60" y="157" font-size="14" fill="rgba(43,43,43,.55)">Name</text>
      <text x="346" y="157" font-size="14" fill="rgba(43,43,43,.55)">Email</text>
      <text x="60" y="231" font-size="14" fill="rgba(43,43,43,.55)">Subject</text>
      <text x="60" y="305" font-size="14" fill="rgba(43,43,43,.55)">Message</text>
      <rect x="42" y="427" width="190" height="46" rx="23" fill="#C86B45"/>
      <text x="137" y="455" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Send Message</text>
    </g>
  </g>
  <!-- floating icons -->
  <g filter="url(#cds)" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#fff">
    <circle cx="210" cy="240" r="46" fill="rgba(249,248,246,.10)" stroke="rgba(249,248,246,.16)"/>
    <text x="210" y="247" text-anchor="middle" font-size="20">@</text>
    <circle cx="1030" cy="520" r="46" fill="rgba(249,248,246,.10)" stroke="rgba(249,248,246,.16)"/>
    <text x="1030" y="527" text-anchor="middle" font-size="20">in</text>
    <circle cx="930" y="620" r="38" fill="rgba(200,107,69,.25)" stroke="rgba(249,248,246,.12)"/>
    <text x="930" y="626" text-anchor="middle" font-size="16">f</text>
  </g>
</svg>