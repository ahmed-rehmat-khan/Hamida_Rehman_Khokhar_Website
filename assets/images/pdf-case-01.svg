<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Community Learning PDF preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A365D"/><stop offset="100%" stop-color="#1E3F20"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F9F8F6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0b1b33" flood-opacity="0.28"/>
    </filter>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b1b33" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="1030" cy="140" r="180" fill="#C86B45" opacity="0.12"/>
  <circle cx="180" cy="760" r="220" fill="#F9F8F6" opacity="0.06"/>
  <!-- back sheet -->
  <g filter="url(#shadow2)" transform="translate(250,120) rotate(-4 350 330)">
    <rect x="0" y="0" width="520" height="660" rx="18" fill="#F3F1EC"/>
  </g>
  <!-- front sheet -->
  <g filter="url(#shadow)" transform="translate(360,95)">
    <rect x="0" y="0" width="520" height="690" rx="18" fill="url(#paper)"/>
    <rect x="0" y="0" width="520" height="96" rx="18" fill="#1A365D"/>
    <rect x="0" y="78" width="520" height="18" fill="#1A365D"/>
    <rect x="34" y="34" width="54" height="54" rx="12" fill="#C86B45"/>
    <text x="49" y="68" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#fff">PDF</text>
    <text x="104" y="56" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#F9F8F6">01</text>
    <text x="104" y="78" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2" fill="rgba(249,248,246,.75)">CASE STUDY BRIEF</text>
    <text x="34" y="150" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#1A365D">Community Learning</text>
    <rect x="34" y="176" width="120" height="6" rx="3" fill="#C86B45"/>
    <!-- sections -->
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="34" y="230" font-size="12" font-weight="700" letter-spacing="2" fill="#C86B45">PROBLEM</text>
      <rect x="34" y="246" width="452" height="10" rx="5" fill="rgba(43,43,43,.12)"/>
      <rect x="34" y="264" width="452" height="10" rx="5" fill="rgba(43,43,43,.10)"/>
      <rect x="34" y="282" width="360" height="10" rx="5" fill="rgba(43,43,43,.08)"/>
      <text x="34" y="332" font-size="12" font-weight="700" letter-spacing="2" fill="#1E3F20">ACTION</text>
      <rect x="34" y="348" width="452" height="10" rx="5" fill="rgba(43,43,43,.12)"/>
      <rect x="34" y="366" width="452" height="10" rx="5" fill="rgba(43,43,43,.10)"/>
      <rect x="34" y="384" width="410" height="10" rx="5" fill="rgba(43,43,43,.08)"/>
      <text x="34" y="434" font-size="12" font-weight="700" letter-spacing="2" fill="#1A365D">OUTCOME</text>
      <rect x="34" y="450" width="452" height="10" rx="5" fill="rgba(43,43,43,.12)"/>
      <rect x="34" y="468" width="452" height="10" rx="5" fill="rgba(43,43,43,.10)"/>
      <rect x="34" y="486" width="330" height="10" rx="5" fill="rgba(43,43,43,.08)"/>
    </g>
    <!-- chart -->
    <rect x="34" y="540" width="452" height="110" rx="14" fill="rgba(26,54,93,.05)" stroke="rgba(26,54,93,.08)"/>
    <rect x="64" y="610" width="46" height="24" rx="6" fill="rgba(26,54,93,.35)"/>
    <rect x="126" y="590" width="46" height="44" rx="6" fill="rgba(30,63,32,.45)"/>
    <rect x="188" y="566" width="46" height="68" rx="6" fill="#C86B45" opacity=".85"/>
    <rect x="250" y="552" width="46" height="82" rx="6" fill="#1A365D" opacity=".85"/>
    <text x="330" y="588" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2B2B2B">Impact snapshot</text>
    <text x="330" y="610" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="rgba(43,43,43,.65)">Documented progress &amp; outcomes</text>
  </g>
</svg>